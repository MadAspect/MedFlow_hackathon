<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>MedFlow</h1>
      <p>Hospital flow & resource optimization simulator</p>
    </div>
    <span class="live">● LIVE SIMULATION</span>
  </header>

  <main>
    <section class="hero">
      <h2>Simulate a hospital scenario</h2>
      <p>Describe the situation in plain English. MedFlow converts it into a simulation.</p>
      <div class="prompt">
        <input id="scenario" value="Simulate a sudden emergency surge with 30 high-urgency patients arriving within 20 minutes.">
        <button onclick="simulate()">RUN SIMULATION</button>
      </div>
      <div id="error"></div>
    </section>

    <section id="summary" class="cards"></section>

    <section class="grid">
      <div class="panel">
        <h3>Resource utilization</h3>
        <div id="resources"></div>
      </div>
      <div class="panel">
        <h3>Optimization recommendation</h3>
        <div id="optimization"></div>
      </div>
    </section>

    <section class="panel">
      <div class="table-head">
        <h3>Patient flow</h3>
        <span id="scenarioInfo"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ID</th><th>Arrival</th><th>Urgency</th><th>Start</th><th>End</th><th>Wait</th><th>Status</th></tr>
          </thead>
          <tbody id="patients"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
